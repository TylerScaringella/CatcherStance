name: Fast checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Check Python modules
        run: |
          python -m py_compile \
            src/backend/jobs.py src/backend/resources.py src/backend/routes.py \
            src/backend/storage.py src/downloader/main.py \
            src/stance_pipeline/analyzer.py src/stance_pipeline/detect.py \
            src/stance_pipeline/runner.py
      - name: Check JavaScript modules
        run: |
          node --input-type=module --check < src/web/app.js
          node --input-type=module --check < src/web/api.js
      - name: Check repository hygiene
        run: |
          git diff --check
          test -z "$(git ls-files data/auth data/runs data/tmp data/processed models/external research/outputs/generated)"
