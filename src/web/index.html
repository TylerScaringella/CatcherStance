<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071b36">
    <title>Catcher Stance · Film Room</title>
    <link rel="stylesheet" href="/styles.css?v=film-room-1">
  </head>
  <body>
    <a class="skip-link" href="#appContent">Skip to content</a>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#/games" aria-label="Catcher Stance Film Room home">
          <span class="brand-mark" aria-hidden="true">CS</span>
          <span>
            <strong>Catcher Stance</strong>
            <small>Film Room</small>
          </span>
        </a>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a href="#/games" data-nav="games">Games</a>
          <a href="#/runs" data-nav="runs">Active Runs</a>
        </nav>
        <div class="header-status">
          <button id="trumediaButton" class="integration-pill" type="button" aria-haspopup="dialog">
            <span class="integration-dot" aria-hidden="true"></span>
            <span id="trumediaText">TruMedia</span>
          </button>
          <button id="activityButton" class="activity-pill" type="button">
            <span class="activity-dot" aria-hidden="true"></span>
            <span id="activityText">Checking runs</span>
          </button>
          <span id="connectionState" class="connection-state">Connecting</span>
        </div>
      </header>

      <main id="appContent" tabindex="-1">
        <section class="loading-screen" aria-label="Loading application">
          <div class="skeleton skeleton-title"></div>
          <div class="skeleton-grid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="toastRegion" class="toast-region" aria-live="polite"></div>

    <dialog id="pitchDialog" class="pitch-dialog" aria-labelledby="pitchDialogTitle">
      <div id="pitchDialogContent"></div>
    </dialog>
    <dialog id="workflowDialog" class="workflow-dialog" aria-labelledby="workflowDialogTitle">
      <div id="workflowDialogContent"></div>
    </dialog>

    <script>
      window.CATCHER_APP_CONFIG = { apiBaseUrl: "" };
    </script>
    <script type="module" src="/app.js?v=film-room-1"></script>
  </body>
</html>
